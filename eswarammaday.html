<head>

<body class="bg-gray-100">

    <!-- Header -->

        fetch('nav.html')
        .then(response => response.text())

  <!-- Container -->
   <!-- Header -->

        <img src="downloaded_images/Easwaramma_Day_2025.jpeg" alt="Eswaramma Day" class="mx-auto mb-4">
