<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Dallas Sai Center</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-blue-500 p-4">
        <div class="container mx-auto flex items-center justify-between">
            <img src="https://ndsai.org/downloaded_images/ssio-logo-english.png" alt="Logo" class="h-16 mr-4">
	    <div class="header-title">
                <h1 class="text-white text-3xl md:text-5xl font-bold">North Dallas Sai Center</h1>
            </div>
            <div class="burger-menu" onclick="toggleMenu()">&#9776;</div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <div id="nav-placeholder"></div>
    <script>
        fetch('nav.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('nav-placeholder').innerHTML = data;
        });
    </script>

    <div class="bg-white p-8 shadow-lg rounded-lg max-w-4xl mx-auto border border-black mt-8">
        <h1 class="text-3xl font-bold text-center mb-6">Contact Us</h1>
        <p class="text-gray-700 mt-2 text-center"><strong>Please Note: Bal Vikas Admissions for 2024-25 is closed.</strong></p>
        <p class="text-center">For any queries, Kindly email us at contact@ndsai.org</p>
    </div>    

    <script src="script.js"></script>

    <footer class="bg-blue-500 p-4 text-white text-center mt-8">
        <p>&copy; 2025 North Dallas Sai Center. All Rights Reserved.</p>
    </footer>

</body>
</html>
